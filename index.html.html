<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Mano v13</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --up:#1a5fa8;--up-dk:#0c3d70;--up-lt:#deeaf8;--up-mid:#2575c4;
  --white:#fff;--bg:#eef2f7;
  --txt:#0d1b2e;--txt2:#1e3a5a;--txt3:#3a5a7a;
  --bdr:#b0c4da;--grn:#1a6630;--grn-lt:#e0f4e4;
  --amb:#a85c00;--err:#c0392b;
  /* Dark mode — deep navy with high-contrast text (fixes white-on-white) */
  --ng-bg:#06111e;--ng-card:#0d1f33;--ng-txt:#e8f4ff;--ng-bdr:#1a3550;
  --ng-btn-bg:#0f2744;--ng-btn-txt:#a8d4f5;--ng-surface:#112236;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#c0ccd8 0%,#a8b8cc 100%);display:flex;justify-content:center;padding:16px;min-height:100vh}
.frame{width:min(390px,100%);max-width:390px;height:min(844px,calc(100vh - 32px));background:var(--white);border-radius:44px;overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.08);position:relative;display:flex;flex-direction:column}
@media(max-width:440px){body{padding:0}.frame{border-radius:0;width:100%;height:100vh;max-width:100%}}
.frame.N{background:var(--ng-bg)}
.sbar{position:absolute;top:0;left:0;right:0;padding:13px 22px 4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--txt);z-index:300;pointer-events:none}
.N .sbar{color:var(--ng-txt)}
.sc{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.scr::-webkit-scrollbar{display:none}
.map-stack{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.map-fill{flex:1;position:relative;overflow:hidden;cursor:grab}
.map-fill:active{cursor:grabbing}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}

/* ═══════ MAPA HTML (divs posicionadas) ═══════ */
.campus-html{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;background:var(--grass,#5a8c4a);}
.ch-lago{position:absolute;left:0;top:8%;width:16%;height:70%;background:linear-gradient(160deg,#3a8fd0,#2878c0);border-radius:0 60% 55% 0 / 0 20% 30% 0;}
.ch-via{position:absolute;background:var(--road,#9ab0a0);}
.ch-via-v{left:47.18%;top:0;width:2.05%;height:100%;}
.ch-via-h{left:0;top:46.8%;width:100%;height:1.07%;}
.ch-via-base{left:0;top:84.8%;width:100%;height:1.07%;}
.ch-via-v::after{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:1px;height:100%;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.5) 0 6px,transparent 6px 11px);}
.ch-via-h::after{content:'';position:absolute;top:50%;left:0;transform:translateY(-50%);height:1px;width:100%;background:repeating-linear-gradient(to right,rgba(255,255,255,.5) 0 6px,transparent 6px 11px);}
.ch-estac{position:absolute;background:var(--park,#7a9898);border-radius:5px;background-image:repeating-linear-gradient(to right,rgba(255,255,255,.30) 0 1px,transparent 1px 14px);}
.ch-estac .et{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:3px;white-space:nowrap;}
.ch-estadio{position:absolute;left:76%;top:47%;width:21%;height:33%;background:var(--stad,#3a7040);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.ch-estadio .pista{width:62%;height:80%;border:5px solid #c05018;border-radius:50%;background:var(--stadIn,#3a6838);}
.ch-estadio .et{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:3px;}
.ch-edif{position:absolute;border-radius:8px;border:1.4px solid rgba(0,0,0,.20);box-shadow:0 2px 6px rgba(0,0,0,.25);}
.ch-edif.bloco{background-image:repeating-linear-gradient(to right,transparent 0 7px,rgba(255,255,255,.10) 7px 9px,transparent 9px 23px),repeating-linear-gradient(to bottom,transparent 0 8px,rgba(255,255,255,.10) 8px 24px,transparent 24px 30px);}
.ch-edif.bloco::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:4px;height:100%;background:rgba(0,0,0,.18);}
.ch-arv{position:absolute;width:14px;height:14px;border-radius:50%;background:#3a7030;box-shadow:inset 2px 2px 0 rgba(120,200,110,.5);transform:translate(-50%,-50%);}
.map-overlay{position:absolute;z-index:40;pointer-events:auto}
.route-sheet{position:absolute;bottom:60px;left:0;right:0;background:var(--white);border-radius:20px 20px 0 0;padding:14px 16px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.12);z-index:50}
.N .route-sheet{background:var(--ng-card)}
.nav{background:rgba(255,255,255,.97);border-top:1px solid var(--bdr);padding:8px 0 20px;display:flex;justify-content:space-around;position:absolute;bottom:0;left:0;right:0;z-index:60;backdrop-filter:blur(10px)}
.N .nav{background:rgba(16,30,46,.97);border-top-color:var(--ng-bdr)}
.nav-static{background:var(--white);border-top:1px solid var(--bdr);padding:8px 0 20px;display:flex;justify-content:space-around;flex-shrink:0;z-index:60}
.N .nav-static{background:var(--ng-card);border-top-color:var(--ng-bdr)}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 12px;border-radius:12px;background:none;border:none;color:var(--txt3);font-size:10px;font-weight:700;transition:all .15s}
.ni.act{color:var(--up)}
.N .ni{color:#7ab0d8}
.N .ni.act{color:#6aaae0}
.ni:hover{background:var(--up-lt);color:var(--up)}
.N .ni:hover{background:rgba(100,160,220,.15);color:#a8d4f5}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--up);margin:0 auto -4px}
.N .nav-dot{background:#6aaae0}
.btn-p{background:var(--up);color:#fff;border:none;border-radius:14px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:background .15s}
.btn-p:hover{background:var(--up-dk)}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-s{background:transparent;color:var(--up-dk);border:2px solid var(--up);border-radius:14px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all .15s}
.btn-s:hover{background:var(--up-lt)}
.inp{width:100%;padding:13px 16px;border:1.5px solid var(--bdr);border-radius:14px;font-size:15px;outline:none;background:var(--white);color:var(--txt);transition:border-color .15s}
.inp:focus{border-color:var(--up)}
.inp.er{border-color:var(--err)!important}
.N .inp{background:var(--ng-card);border-color:var(--ng-bdr);color:var(--ng-txt)}
.err-msg{font-size:12px;font-weight:700;color:var(--err);margin-top:5px;display:none;padding-left:4px}
.err-msg.show{display:block}
.hdr{background:var(--up);padding:50px 16px 14px;flex-shrink:0}
.hdr.nv{background:var(--ng-card);border-bottom:1px solid var(--ng-bdr)}
.card{background:var(--white);border:1px solid var(--bdr);border-radius:16px;margin:0 14px 10px;overflow:hidden}
.N .card{background:var(--ng-card);border-color:var(--ng-bdr)}
.N .acc-b{color:#a8d4f5!important}
.li{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;gap:12px;transition:background .1s}
.li:last-child{border-bottom:none}
.li:hover{background:var(--up-lt)}
.N .li{border-bottom-color:var(--ng-bdr)}
.N .li:hover{background:rgba(100,160,220,.07)}
.t1{font-size:15px;font-weight:700;color:var(--txt)}
.t2{font-size:13px;color:var(--txt3);margin-top:1px}
.t3{font-size:13px;font-weight:700;color:var(--up)}
.N .t1{color:var(--ng-txt)}
.N .t2{color:#7ab0d8}
.N .t3{color:#6aaae0}
.sec{font-size:12px;font-weight:800;color:var(--txt2);padding:12px 16px 8px;text-transform:uppercase;letter-spacing:.7px}
.N .sec{color:#7ab0d8}
.ib{width:40px;height:40px;background:var(--up-lt);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.N .ib{background:rgba(26,95,168,.22)}
.tag{display:inline-block;background:var(--up-lt);color:var(--up-dk);font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;margin:2px}
.N .tag{background:rgba(26,95,168,.25);color:#6aaae0}
.fbtn{width:100%;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:14px;padding:12px 16px;cursor:pointer;color:#fff;font-size:14px;font-weight:700;margin-bottom:10px;text-align:left;transition:background .15s}
.fbtn:hover{background:rgba(255,255,255,.25)}
.acc-h{width:100%;padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--txt);background:none;border:none;text-align:left;border-bottom:1px solid var(--bdr);transition:background .1s}
.acc-h:hover{background:var(--up-lt)}
.N .acc-h{color:var(--ng-txt);border-bottom-color:var(--ng-bdr)}
.acc-b{font-size:13px;color:var(--txt2);line-height:1.6;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s;padding:0 16px}
.acc-b.op{max-height:200px;padding:0 16px 14px}
.N .acc-b{color:#c4dff5!important}
.flb{padding:8px 14px;border-radius:10px;border:2px solid var(--bdr);background:transparent;font-size:13px;font-weight:700;cursor:pointer;color:var(--txt2);transition:all .15s}
.flb.act{background:var(--up);color:#fff;border-color:var(--up)}
.N .flb{border-color:var(--ng-bdr);color:#7ab0d8}
.N .flb.act{background:var(--up);border-color:var(--up);color:#fff}
.rhdl{width:36px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 12px}
.N .rhdl{background:var(--ng-bdr)}
.stat{display:flex;gap:8px;margin-bottom:12px}
.st-box{flex:1;border-radius:12px;padding:9px 10px}
/* MARKERS */
.mk{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:10;transition:transform .15s}
.mk:hover{transform:translate(-50%,-50%) scale(1.12)}
.mk.active-mk .mk-pin{box-shadow:0 0 0 4px rgba(255,220,0,.6),0 3px 10px rgba(0,0,0,.35)}
.mk-pin{width:36px;height:36px;border-radius:50%;transform:none;display:flex;align-items:center;justify-content:center;border:2.5px solid rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.mk-ic{transform:none;color:#fff;font-size:14px;font-weight:900}
.mk-lbl{background:rgba(255,255,255,.97);color:var(--txt);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:3px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.N .mk-lbl{background:rgba(16,30,46,.97);color:var(--ng-txt)}
/* MAP UI */
.ms-wrap{display:flex;align-items:center;background:rgba(255,255,255,.98);border-radius:14px;padding:10px 14px;gap:10px;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.N .ms-wrap{background:rgba(16,30,46,.97)}
.ms-wrap input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--txt);font-weight:600}
.N .ms-wrap input{color:var(--ng-txt)}
.sr-box{background:rgba(255,255,255,.99);border-radius:12px;margin-top:5px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.N .sr-box{background:rgba(16,30,46,.99)}
.sri{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);transition:background .1s}
.sri:last-child{border-bottom:none}
.sri:hover{background:var(--up-lt)}
.N .sri{border-bottom-color:var(--ng-bdr)}
.sri-nm{font-size:13px;font-weight:700;color:var(--txt)}
.sri-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.N .sri-nm{color:var(--ng-txt)}
.N .sri-sub{color:#7ab0d8}
.zbtn{width:34px;height:34px;background:rgba(255,255,255,.97);border:none;border-radius:10px;cursor:pointer;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.14);transition:transform .1s;line-height:1}
.zbtn:hover{transform:scale(1.07)}
.N .zbtn{background:rgba(16,30,46,.96);color:var(--ng-txt)}
.back-b{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:#fff;font-size:15px;font-weight:700;padding:0}
.cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.cg-c{background:var(--up-lt);border-radius:16px;padding:14px;cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;gap:7px;transition:all .15s}
.cg-c:hover{border-color:var(--up);transform:translateY(-1px)}
.N .cg-c{background:var(--ng-card);border-color:var(--ng-bdr)}
.cg-ic{width:42px;height:42px;background:var(--up);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
.cg-nm{font-size:14px;font-weight:700;color:var(--txt)}
.cg-sub{font-size:11px;color:var(--txt3)}
.N .cg-nm{color:var(--ng-txt)}
.N .cg-sub{color:#7ab0d8}
.pg{padding-bottom:0;background:var(--bg);flex:1;overflow-y:auto}
.N .pg{background:var(--ng-bg)}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;border:2.5px solid rgba(255,255,255,.5);overflow:hidden}
.fav-btn{width:28px;height:28px;border:none;background:none;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fav-btn:hover{transform:scale(1.2)}
.user-dot{position:absolute;width:18px;height:18px;background:#1a5fa8;border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px rgba(26,95,168,.35),0 0 12px rgba(26,95,168,.5);z-index:15;transform:translate(-50%,-50%)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,95,168,.6),0 0 12px rgba(26,95,168,.4)}70%{box-shadow:0 0 0 10px rgba(26,95,168,0),0 0 12px rgba(26,95,168,.3)}100%{box-shadow:0 0 0 0 rgba(26,95,168,0)}}
.user-dot{animation:pulse 2s infinite}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-sheet{background:var(--white);border-radius:24px 24px 0 0;padding:24px 20px 32px;width:100%;animation:slideUp .25s ease}
.N .modal-sheet{background:var(--ng-card)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.avatar-edit{position:relative;width:90px;height:90px;margin:0 auto}
.avatar-big{width:90px;height:90px;border-radius:50%;background:var(--up);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;border:4px solid var(--up-lt);cursor:pointer;overflow:hidden;object-fit:cover}
.avatar-edit-badge{position:absolute;bottom:0;right:0;width:28px;height:28px;background:var(--up);border-radius:50%;border:2px solid var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.toast{position:absolute;top:70px;left:16px;right:16px;background:#0c3d70;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;z-index:500;text-align:center;animation:fadeInOut 2.5s forwards;pointer-events:none}
@keyframes fadeInOut{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}
#photoInput{display:none}
/* Highlight pulse for selected block */
@keyframes mkHighlight{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.18)}}
.mk.highlighted{animation:mkHighlight 0.6s ease 2}
/* Map campus styled */
.campus-map{width:100%;height:100%;position:relative;overflow:hidden}
</style>
</head>
<body>
<div class="frame" id="app">
  <div class="sbar"><span id="clockTxt">9:41</span><span>&#9679;&#9679;&#9679; &#128246; &#128267;</span></div>
  <div class="sc" id="sc">
    <div class="scr" id="scr"></div>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(event)">
<script>
/* ══════ STATE ══════ */
const app=document.getElementById('app');
const sc=document.getElementById('sc');
const scr=document.getElementById('scr');
let N=false,screen='login',routeTarget=null,activeFloor={A:1,V:1,AZUL:1};
let userInfo={name:'Visitante',email:'',avatar:'👤',isVisitor:true,avatarImg:null};
let favorites=[];
let registeredUsers={};

/* MAP TRANSFORM */
const MAP_W=390,MAP_H=750;
let mScale=1,mOx=0,mOy=0,dragging=false,dS={};
let pinching=false,pinchD0=0,pinchS0=1;

function updateClock(){const n=new Date();const el=document.getElementById('clockTxt');if(el)el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}

/* ══════ ROUTER ══════ */
function go(s,d){screen=s;render(d)}
function setN(v){N=v;v?app.classList.add('N'):app.classList.remove('N')}

function addNav(active,floating){
  const prev=document.querySelector('.nav,.nav-static');if(prev)prev.remove();
  const items=[
    {id:'home',ico:'🏠',lbl:'Início',s:'home'},
    {id:'map', ico:'🗺️',lbl:'Mapa',  s:'map'},
    {id:'blk', ico:'🏢',lbl:'Blocos',s:'blocks'},
    {id:'fac', ico:'💬',lbl:'FAC',   s:'fac'}
  ];
  const n=document.createElement('div');
  n.className=floating?'nav':'nav-static';
  n.innerHTML=items.map(i=>`<button class="ni ${active===i.id?'act':''}" onclick="navClick('${i.s}')">${active===i.id?'<div class="nav-dot"></div>':''}</button>`).join('');
  // rebuild properly
  n.innerHTML='';
  items.forEach(i=>{
    const btn=document.createElement('button');
    btn.className='ni'+(active===i.id?' act':'');
    btn.onclick=()=>navClick(i.s);
    btn.innerHTML=(active===i.id?'<div class="nav-dot"></div>':'')+i.ico+'<span>'+i.lbl+'</span>';
    n.appendChild(btn);
  });
  if(floating){document.querySelector('.map-stack')?.appendChild(n);}
  else{document.querySelector('.sc')?.appendChild(n);}
}

function navClick(s){
  if(s==='home'&&userInfo.isVisitor){go('home');return;}
  go(s);
}

function render(d){
  switch(screen){
    case 'login':rLogin();break;
    case 'register':rRegister();break;
    case 'home':rHome();break;
    case 'map':rMap(d);break;
    case 'navigate':rNavigate(d);break;
    case 'blocks':rBlocks();break;
    case 'blkD':rBlkD(d);break;
    case 'sectors':rSectors();break;
    case 'fac':rFAC();break;
    case 'profile':rProfile();break;
    case 'editProfile':rEditProfile();break;
    case 'favorites':rFavorites();break;
    case 'visitorBlock':rVisitorBlock();break;
  }
}

function valFPEmail(){
  const el=document.getElementById('fpEmail'),err=document.getElementById('fpEmailErr'),btn=document.getElementById('fpSendBtn');

  if(btn)btn.disabled=!valid;
}

function doForgotPassword(){
  const email=document.getElementById('fpEmail')?.value.trim()||'';
  const valid=email.endsWith('@up.edu.br')||email.endsWith('@cs.up.edu.br');
  if(!valid)return;
  const btn=document.getElementById('fpSendBtn');

  // Simulate async send
  setTimeout(()=>{
    const succ=document.getElementById('fpSuccessMsg'),emailTxt=document.getElementById('fpSuccessEmail');
    if(succ)succ.style.display='block';
    if(emailTxt)emailTxt.textContent=`Um link foi enviado para ${email}`;
    if(btn){btn.textContent='Reenviar';btn.disabled=false;}
    document.getElementById('fpEmail').disabled=true;
  },1200);
}

function valEmail(){
  const el=document.getElementById('lEmail'),err=document.getElementById('emailErr');
  if(!el)return;
  const v=el.value.trim(),valid=v.endsWith('@up.edu.br')||v.endsWith('@cs.up.edu.br'),hasAt=v.includes('@');
  if(hasAt&&!valid){el.classList.add('er');err.classList.add('show');}
  else{el.classList.remove('er');err.classList.remove('show');}
  valLogin();
}

function valLogin(){
  const email=document.getElementById('lEmail')?.value.trim()||'';
  const name=document.getElementById('lName')?.value.trim()||'';
  const pass=document.getElementById('lPass')?.value||'';
  const validEmail=email.endsWith('@up.edu.br')||email.endsWith('@cs.up.edu.br');
  const btn=document.getElementById('loginBtn');
  if(btn)btn.disabled=!(validEmail&&name&&pass);
}

function doLogin(){
  const name=document.getElementById('lName')?.value.trim()||'';
  const email=document.getElementById('lEmail')?.value.trim()||'';
  const pass=document.getElementById('lPass')?.value||'';
  const nameErr=document.getElementById('nameErr');
  const passErr=document.getElementById('passErr');
  const genErr=document.getElementById('loginGenErr');
  let hasErr=false;
  if(!name){nameErr.classList.add('show');document.getElementById('lName').classList.add('er');hasErr=true;}
  else{nameErr.classList.remove('show');document.getElementById('lName').classList.remove('er');}
  if(!pass){passErr.classList.add('show');document.getElementById('lPass').classList.add('er');hasErr=true;}
  else{passErr.classList.remove('show');document.getElementById('lPass').classList.remove('er');}
  const validEmail=email.endsWith('@up.edu.br')||email.endsWith('@cs.up.edu.br');
  if(!validEmail){hasErr=true;}
  if(hasErr){
    if(genErr){genErr.style.display='block';genErr.textContent='⚠ Preencha todos os campos corretamente.';}
    return;
  }
  const reg=registeredUsers[email];
  const initials=name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'EU';
  userInfo={name:reg?reg.name:name,email,avatar:reg?reg.avatar:initials,isVisitor:false,avatarImg:reg?reg.avatarImg:null};
  go('home');
}

function doVisitor(){
  userInfo={name:'Visitante',email:'',avatar:'👤',isVisitor:true,avatarImg:null};
  go('map');
}

let regPhotoData=null;
function handleRegPhoto(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{
    regPhotoData=ev.target.result;
    const wrap=document.getElementById('regAvatarWrap');
    if(wrap)wrap.innerHTML=`<img src="${regPhotoData}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;"><div style="position:absolute;bottom:0;right:0;width:24px;height:24px;background:var(--up);border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;">✏️</div>`;
  };r.readAsDataURL(f);
}

function valReg(){
  const name=document.getElementById('rName')?.value.trim()||'';
  const email=document.getElementById('rEmail')?.value.trim()||'';
  const pass=document.getElementById('rPass')?.value||'';
  const pass2=document.getElementById('rPass2')?.value||'';
  const emailValid=email.endsWith('@up.edu.br')||email.endsWith('@cs.up.edu.br');
  const emailEl=document.getElementById('rEmail');
  const emailErrEl=document.getElementById('rEmailErr');
  if(email.includes('@')&&!emailValid){emailEl?.classList.add('er');emailErrEl?.classList.add('show');}
  else{emailEl?.classList.remove('er');emailErrEl?.classList.remove('show');}
  const passErrEl=document.getElementById('rPassErr');
  if(pass&&pass.length<6){document.getElementById('rPass')?.classList.add('er');passErrEl?.classList.add('show');}
  else{document.getElementById('rPass')?.classList.remove('er');passErrEl?.classList.remove('show');}
  const pass2ErrEl=document.getElementById('rPass2Err');
  if(pass2&&pass!==pass2){document.getElementById('rPass2')?.classList.add('er');pass2ErrEl?.classList.add('show');}
  else{document.getElementById('rPass2')?.classList.remove('er');pass2ErrEl?.classList.remove('show');}
  const btn=document.getElementById('regBtn');
  if(btn)btn.disabled=!(name&&emailValid&&pass.length>=6&&pass===pass2);
}

function doRegister(){
  const name=document.getElementById('rName')?.value.trim()||'';
  const email=document.getElementById('rEmail')?.value.trim()||'';
  const initials=name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'EU';

function drawCampusMap(canvas){
  const W=canvas.width,H=canvas.height;
  const ctx=canvas.getContext('2d');
  const dk=N;

  const col={
    grass: dk?'#1e3322':'#5a8c4a',
    road:  dk?'#354a60':'#9ab0a0',
    rdLn:  dk?'rgba(255,255,255,0.14)':'rgba(255,255,255,0.48)',
    water: dk?'#1a4a80':'#3a8fd0',
    park:  dk?'#202e3c':'#7a9898',
    pkLn:  dk?'rgba(100,150,190,0.22)':'rgba(255,255,255,0.30)',
    bStr:  dk?'rgba(255,255,255,0.13)':'rgba(0,0,0,0.18)',
    lbBg:  dk?'rgba(5,12,22,0.88)':'rgba(0,0,0,0.62)',
    tree:  dk?'#1e4028':'#3a7030',
    tTop:  dk?'rgba(45,100,55,0.8)':'rgba(65,140,55,0.75)',
    stad:  dk?'#1a3820':'#3a7040',
    trk:   dk?'#8B4513':'#c05018',
    tIn:   dk?'#1e3822':'#3a6838',
  };

  // ── TAMANHOS PADRONIZADOS ──
  const BW=88, BH=88;   // blocos: par duplo
  const SW=41, GAP=4;   // sub-bloco: 41+4+41=86 ≈ BW
  const SQ=76;          // biblioteca/reitoria: quadrado
  const RW=82, RH=34;   // refeitório: retângulo horizontal

  function rr(x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);
    ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.4;ctx.stroke();}
  }

  // Desenha um bloco estilo "Azul" — dois sub-retângulos lado a lado com gap
  function bloco(x,y,cor){
    rr(x,      y, SW, BH, 7, cor, col.bStr);
    rr(x+SW+GAP,y, SW, BH, 7, cor, col.bStr);
    // janelas
    ctx.save();ctx.fillStyle='rgba(255,255,255,0.10)';
    for(let sb=0;sb<2;sb++){
      const bx=x+sb*(SW+GAP);
      for(let r=0;r<3;r++)for(let c=0;c<2;c++)
        ctx.fillRect(bx+7+c*16,y+8+r*22,12,16);
    }
    ctx.restore();
    // passagem entre os dois
    ctx.fillStyle=col.road;ctx.globalAlpha=0.22;
    ctx.fillRect(x+SW,y,GAP,BH);ctx.globalAlpha=1;
  }

  // Bloco quadrado (Biblioteca/Reitoria)
  function quadrado(x,y,cor){
    rr(x,y,SQ,SQ,8,cor,col.bStr);
    ctx.save();ctx.fillStyle='rgba(255,255,255,0.10)';
    for(let r=0;r<2;r++)for(let c=0;c<2;c++)
      ctx.fillRect(x+8+c*26,y+8+r*26,20,20);
    ctx.restore();
  }

  // Refeitório: retângulo horizontal
  function refeitorio(x,y,cor){
    rr(x,y,RW,RH,8,cor,col.bStr);
    ctx.save();ctx.fillStyle='rgba(255,255,255,0.10)';
    for(let c=0;c<4;c++)ctx.fillRect(x+7+c*17,y+7,13,RH-14);
    ctx.restore();
  }

  // 1. GRAMA
  ctx.fillStyle=col.grass;ctx.fillRect(0,0,W,H);

  // 2. LAGO
  ctx.fillStyle=dk?'#1a4a80':'#3a8fd0';
  ctx.beginPath();
  ctx.moveTo(0,75);
  ctx.bezierCurveTo(22,70,58,88,64,148);
  ctx.bezierCurveTo(72,215,70,275,62,332);
  ctx.bezierCurveTo(68,374,68,408,57,455);
  ctx.bezierCurveTo(50,505,40,548,22,578);
  ctx.lineTo(0,578);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1.1;
  [[5,130,19,137],[5,220,17,227],[5,315,16,322],[5,420,15,427],[5,510,14,517]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  });

  // 3. VIAS
  // Vertical (centro x=188)
  ctx.fillStyle=col.road;ctx.fillRect(184,0,8,H);
  ctx.strokeStyle=col.rdLn;ctx.lineWidth=0.7;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(188,0);ctx.lineTo(188,H);ctx.stroke();ctx.setLineDash([]);
  // Horizontal (centro y=355)
  ctx.fillStyle=col.road;ctx.fillRect(0,351,W,8);
  ctx.strokeStyle=col.rdLn;ctx.lineWidth=0.7;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(0,355);ctx.lineTo(W,355);ctx.stroke();ctx.setLineDash([]);
  // Via base (y=636-644)
  ctx.fillStyle=col.road;ctx.fillRect(0,636,W,8);
  ctx.strokeStyle=col.rdLn;ctx.lineWidth=0.6;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(0,640);ctx.lineTo(W,640);ctx.stroke();ctx.setLineDash([]);

  // Acessos laterais
  ctx.fillStyle=col.road;ctx.globalAlpha=0.38;
  ctx.fillRect(66,140,122,5);ctx.fillRect(66,230,122,5);ctx.fillRect(66,316,122,5);
  ctx.fillRect(192,155,85,5);ctx.fillRect(192,255,85,5);
  ctx.fillRect(66,405,122,5);ctx.fillRect(66,405,122,5);
  ctx.fillRect(192,405,85,5);
  ctx.fillRect(192,458,85,5); // acesso ref direito
  ctx.globalAlpha=1;

  // 4. ESTACIONAMENTOS
  rr(59,617,125,67,4,col.park,null);
  ctx.strokeStyle=col.pkLn;ctx.lineWidth=0.8;
  for(let x=69;x<182;x+=13){ctx.beginPath();ctx.moveTo(x,619);ctx.lineTo(x,682);ctx.stroke();}
  ctx.save();ctx.strokeStyle=dk?'rgba(100,160,200,0.25)':'rgba(255,255,255,0.38)';
  ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(59,650);ctx.lineTo(184,650);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();

  rr(193,558,125,94,4,col.park,null);
  ctx.strokeStyle=col.pkLn;ctx.lineWidth=0.8;
  for(let y=568;y<650;y+=14){ctx.beginPath();ctx.moveTo(195,y);ctx.lineTo(316,y);ctx.stroke();}

  // 5. ESTÁDIO
  rr(295,365,83,207,5,col.stad,col.bStr);
  ctx.strokeStyle=col.trk;ctx.lineWidth=7;
  ctx.beginPath();ctx.ellipse(336,468,28,72,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=col.tIn;
  ctx.beginPath();ctx.ellipse(336,468,20,64,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.20)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(315,468);ctx.lineTo(357,468);ctx.stroke();
  ctx.beginPath();ctx.ellipse(336,468,7,14,0,0,Math.PI*2);ctx.stroke();
  rr(348,365,35,100,4,dk?'#1a2e3a':'#5a7888',col.bStr);

  // 6. EDIFÍCIOS

  // ── NORTE-ESQ ──
  bloco(95,   100, dk?'#8040e0':'#7c3adb');  // Bloco da Pós
  quadrado(88, 196, dk?'#e08030':'#d97706'); // Biblioteca
  quadrado(90, 280, dk?'#30b860':'#16a34a'); // Reitoria

  // ── NORTE-DIR ──
  bloco(197, 115, dk?'#9a6030':'#7c4a1a');   // Bloco Marrom
  bloco(207, 215, dk?'#e0a010':'#c8900a');   // Bloco Amarelo

  // ── SUL-ESQ ──
  bloco(92,  365, dk?'#3070e8':'#1d4ed8');   // Bloco Azul
  // Refeitório esquerdo (abaixo do Bloco Azul)
  rr(92,  458, BW, 34, 8, dk?'#f08030':'#ea580c', col.bStr);
  // Refeitório direito (abaixo do Bloco Bege)
  rr(198, 458, BW, 34, 8, dk?'#f08030':'#ea580c', col.bStr);
  // Janelas dos dois refeitórios
  ctx.save();ctx.fillStyle='rgba(255,255,255,0.10)';
  [92,198].forEach(rx=>{
    for(let c=0;c<4;c++)ctx.fillRect(rx+7+c*18,465,13,13);
  });
  ctx.restore();
  bloco(92,  497, dk?'#e84040':'#c0392b');   // Bloco Vermelho

  // ── SUL-DIR ──
  bloco(198, 365, dk?'#c08040':'#b07030');   // Bloco Bege

  // 7. ÁRVORES
  ctx.save();
  [[182,90],[182,190],[182,272],[182,357],[182,408],[182,490],[182,530],
   [70,355],[132,355],[243,355],[318,355],
   [74,75],[146,75],[246,75],
   [74,640],[148,640],[255,640],[336,415],[336,535]
  ].forEach(([x,y])=>{
    ctx.fillStyle=col.tree;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col.tTop;ctx.beginPath();ctx.arc(x-2,y-2,3,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();

  // 8. LABELS
  function sm(txt,x,y){
    ctx.save();ctx.font='bold 8px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=ctx.measureText(txt).width+8;
    ctx.fillStyle=col.lbBg;ctx.beginPath();ctx.roundRect(x-tw/2,y-5.5,tw,11,2);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(txt,x,y);ctx.restore();
  }
  sm('Estac.',121,650);sm('Estac.',255,605);sm('Estádio',336,468);
}

    mk.onclick=()=>mkClick(m.id);

  /* Search — botão flutuante de lupa, expande ao clicar */

/* ══════ ROUTE RESOLVE & BUILD ══════ */
function resolvePathId(tid){
  if(!tid)return null;
  const tl=tid.toLowerCase();
  // 1. Exact label match first (highest priority)
  const mkExact=MARKERS.find(m=>tl===m.lbl.toLowerCase());
  if(mkExact&&PATHS[mkExact.id])return mkExact.id;
  // 2. Exact ID match
  const mkId=MARKERS.find(m=>tl===m.id.toLowerCase());
  if(mkId&&PATHS[mkId.id])return mkId.id;
  // 3. Room name match → route to that block
  const room=ALL_ROOMS.find(r=>tl.includes(r.name.toLowerCase())||r.name.toLowerCase().includes(tl));
  if(room&&PATHS[room.block])return room.block;
  // 4. Keyword fallbacks — ordered from most specific to least
  if(tl.includes('biblioteca')||tl.includes('biblio'))return'B';
  if(tl.includes('reitoria'))return'R';
  if(tl.includes('bloco azul')||tl.includes('azul'))return'AZUL';
  if(tl.includes('amarelo')||tl.includes('bloco a'))return'A';
  if(tl.includes('marrom')||tl.includes('bloco ma')||tl.includes('bloco m'))return'MA';
  if(tl.includes('vermelho')||tl.includes('bloco v'))return'V';
  if(tl.includes('bege')||tl.includes('bloco b')||tl.includes('bloco e'))return'BE';
  if(tl.includes('estacion'))return'V';
  if(tl.includes('refeit')&&tl.includes('norte'))return'RN';
  if(tl.includes('refeit')&&tl.includes('central'))return'RC';
  if(tl.includes('refeit'))return'RC'; // default to central refeitório
  // 5. Partial label match (last resort)
  const mkPartial=MARKERS.find(m=>tl.includes(m.lbl.toLowerCase())||m.lbl.toLowerCase().includes(tl));
  if(mkPartial&&PATHS[mkPartial.id])return mkPartial.id;
  return null; // unknown destination
}

function buildRouteSVG(tid,animated){
  const pid=resolvePathId(tid);
  if(!pid||!PATHS[pid])return'';
  // Vibrant solid blue route - clearly visible on the dark-green map
  const col='#3b82f6';          // bright blue
  const colGlow='rgba(59,130,246,0.45)';
  const colOuter='rgba(59,130,246,0.18)';
  const pts=PATHS[pid];
  const d='M '+pts.map(p=>p.x+' '+p.y).join(' L ');
  const last=pts[pts.length-1];
  const first=pts[0]; // user position
  const totalLen=pts.reduce((acc,p,i)=>i===0?0:acc+Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y),0);
  const animStyle=animated
    ?`<style>
        @keyframes routeDraw{from{stroke-dashoffset:${totalLen.toFixed(0)}}to{stroke-dashoffset:0}}
        .rp{stroke-dasharray:${totalLen.toFixed(0)};stroke-dashoffset:${totalLen.toFixed(0)};animation:routeDraw 1.6s cubic-bezier(.4,0,.2,1) forwards;}
        @keyframes destPulse{0%,100%{r:9;opacity:.5}50%{r:13;opacity:.25}}
        .dp{animation:destPulse 1.6s ease-in-out infinite;}
      </style>`
    :'';
  return`<svg width="${MAP_W}" height="${MAP_H}" viewBox="0 0 ${MAP_W} ${MAP_H}" style="position:absolute;top:0;left:0;pointer-events:none;z-index:5;">
    <defs>
      ${animStyle}
      <filter id="rf">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
        <feComposite in="blur" in2="SourceGraphic" operator="over"/>
      </filter>
      <marker id="rarrow" viewBox="0 0 12 12" refX="10" refY="6"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M1 1L10 6L1 11" fill="none" stroke="${col}" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Outer glow for depth -->
    <path d="${d}" fill="none" stroke="${colOuter}" stroke-width="14"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mid glow -->
    <path d="${d}" fill="none" stroke="${colGlow}" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Main solid route line — draws on animation -->
    <path class="${animated?'rp':''}" d="${d}" fill="none" stroke="${col}"
      stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
      marker-end="url(#rarrow)" opacity="1"/>

    <!-- Destination marker: pulsing rings -->
    <circle class="${animated?'dp':''}" cx="${last.x}" cy="${last.y}" r="11"
      fill="${col}" opacity=".28"/>
    <circle cx="${last.x}" cy="${last.y}" r="8" fill="${col}" opacity=".45"/>
    <circle cx="${last.x}" cy="${last.y}" r="5" fill="${col}"/>
    <circle cx="${last.x}" cy="${last.y}" r="2.5" fill="white"/>

    <!-- Start: user position indicator (blue GPS dot) -->
    <circle cx="${first.x}" cy="${first.y}" r="10" fill="rgba(59,130,246,0.25)"/>
    <circle cx="${first.x}" cy="${first.y}" r="6" fill="#3b82f6"/>
    <circle cx="${first.x}" cy="${first.y}" r="3" fill="white"/>
  </svg>`;
}

/* ══════ MAP TRANSFORM ══════ */
function minScale(vW,vH){
  // fit-all: mostra o campus inteiro com pequena margem
  const fitW=(vW-16)/MAP_W, fitH=(vH-16)/MAP_H;
  return Math.min(fitW,fitH,1.0);  // nunca menor que fit, nunca maior que 1x
}
function clampS(s,vW,vH){return Math.min(Math.max(s,minScale(vW,vH)),4)}
function clampO(ox,oy,s,vW,vH){
  // permite centralizar quando o mapa é menor que o viewport
  const minX=Math.min(0,vW-MAP_W*s), maxX=Math.max(0,(vW-MAP_W*s)/2);
  const minY=Math.min(0,vH-MAP_H*s), maxY=Math.max(0,(vH-MAP_H*s)/2);
  return{x:Math.min(maxX,Math.max(minX,ox)),y:Math.min(maxY,Math.max(minY,oy))};}
function applyT(){const c=document.getElementById('mCvs');if(c)c.style.transform=`translate(${mOx}px,${mOy}px) scale(${mScale})`;}
function initT(vW,vH){mScale=minScale(vW,vH);mOx=(vW-MAP_W*mScale)/2;mOy=(vH-MAP_H*mScale)/2;const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();}
function doZoom(f,px,py,vW,vH){const ns=clampS(mScale*f,vW,vH),r=ns/mScale;mOx=px-r*(px-mOx);mOy=py-r*(py-mOy);mScale=ns;const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();}

function zoomToUser(vW,vH){
  // Zoom to user position at bottom center, showing enough context
  const targetScale=Math.min(clampS(2.2,vW,vH),2.2);const steps=24;let step=0;
  const start={s:mScale,ox:mOx,oy:mOy};
  function tick(){step++;const t=step/steps;const ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    mScale=start.s+(targetScale-start.s)*ease;
    // Center slightly above the user so there's space to see the route going up
    const focusY=USER_POS.y-60;
    const tox=vW/2-USER_POS.x*targetScale;const toy=vH*0.65-focusY*targetScale;
    mOx=start.ox+(tox-start.ox)*ease;mOy=start.oy+(toy-start.oy)*ease;
    const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();
    if(step<steps)requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}

function zoomToTarget(tid,vW,vH){
  const pid=resolvePathId(tid);
  const mk=MARKERS.find(m=>m.id===pid);
  if(!mk){zoomToUser(vW,vH);return;}
  const tx=mk.px*MAP_W,ty=mk.py*MAP_H;
  const targetScale=Math.min(clampS(2.0,vW,vH),2.0);const steps=24;let step=0;
  const start={s:mScale,ox:mOx,oy:mOy};
  function tick(){step++;const t=step/steps;const ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    mScale=start.s+(targetScale-start.s)*ease;
    // Center between user and target
    const midX=(USER_POS.x+tx)/2,midY=(USER_POS.y+ty)/2;
    const tox=vW/2-midX*targetScale;const toy=vH/2-midY*targetScale;
    mOx=start.ox+(tox-start.ox)*ease;mOy=start.oy+(toy-start.oy)*ease;
    const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();
    if(step<steps)requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}

function showSearchBar(){/* search is always available as icon */}
let searchHideTimer=null;

function initDrag(outer,vW,vH){
  outer.addEventListener('mousedown',e=>{
    if(e.target.closest('.mk,.map-overlay'))return;
    dragging=true;dS={x:e.clientX,y:e.clientY,ox:mOx,oy:mOy};outer.style.cursor='grabbing';e.preventDefault();
    hideSearchBar();clearTimeout(searchHideTimer);
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;mOx=dS.ox+(e.clientX-dS.x);mOy=dS.oy+(e.clientY-dS.y);const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();
  });
  document.addEventListener('mouseup',()=>{if(dragging){dragging=false;const o=document.getElementById('mOuter');if(o)o.style.cursor='grab';searchHideTimer=setTimeout(showSearchBar,600);}});
  outer.addEventListener('wheel',e=>{e.preventDefault();const r=outer.getBoundingClientRect();doZoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top,vW,vH);hideSearchBar();clearTimeout(searchHideTimer);searchHideTimer=setTimeout(showSearchBar,800);},{passive:false});
  outer.addEventListener('touchstart',e=>{
    if(e.target.closest('.mk'))return;
    if(e.touches.length===1){const t=e.touches[0];dragging=true;dS={x:t.clientX,y:t.clientY,ox:mOx,oy:mOy};hideSearchBar();clearTimeout(searchHideTimer);}
    else if(e.touches.length===2){dragging=false;pinching=true;pinchD0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchS0=mScale;hideSearchBar();}
  },{passive:true});
  outer.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(dragging&&e.touches.length===1){const t=e.touches[0];mOx=dS.ox+(t.clientX-dS.x);mOy=dS.oy+(t.clientY-dS.y);const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();}
    else if(pinching&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const ns=clampS(pinchS0*(d/pinchD0),vW,vH);const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;const rect=outer.getBoundingClientRect();const r=ns/mScale;mOx=(cx-rect.left)-r*((cx-rect.left)-mOx);mOy=(cy-rect.top)-r*((cy-rect.top)-mOy);mScale=ns;const c=clampO(mOx,mOy,mScale,vW,vH);mOx=c.x;mOy=c.y;applyT();}
  },{passive:false});
  outer.addEventListener('touchend',()=>{dragging=false;pinching=false;searchHideTimer=setTimeout(showSearchBar,600);});
}

  stack.appendChild(panel);
  scr.appendChild(stack);
  
  const eta=new Date(Date.now()+mins*60000);const etaEl=document.getElementById('etaTime');
  if(etaEl)etaEl.textContent=String(eta.getHours()).padStart(2,'0')+':'+String(eta.getMinutes()).padStart(2,'0');
  
  const outer=document.getElementById('mNavOuter');if(!outer)return;
  // Use requestAnimationFrame to get real dimensions after flex layout
  requestAnimationFrame(()=>{
    const vW=outer.clientWidth||390,vH=outer.clientHeight||360;
    initT(vW,vH);
    initDrag(outer,vW,vH);
    document.getElementById('navZIn')?.addEventListener('click',()=>doZoom(1.25,vW/2,vH/2,vW,vH));
    document.getElementById('navZOut')?.addEventListener('click',()=>doZoom(.8,vW/2,vH/2,vW,vH));
    document.getElementById('navCenter')?.addEventListener('click',()=>zoomToUser(vW,vH));
    // Auto-zoom to user position with animation (Google Maps style)
    setTimeout(()=>zoomToUser(vW,vH),300);
  });
}

/* ══════ SEARCH ══════ */
function hSrch(v){
  const box=document.getElementById('srBox');if(!box)return;
  if(!v.trim()){box.style.display='none';return;}
  const tl=v.toLowerCase();
  const roomHits=ALL_ROOMS.filter(r=>r.name.toLowerCase().includes(tl)||r.bName.toLowerCase().includes(tl)).slice(0,5);
  const mkHits=MARKERS.filter(m=>m.lbl.toLowerCase().includes(tl)).map(m=>{return{name:m.lbl,block:m.id,bName:'Campus',floor:0,fLbl:'Referência'}});
  const hits=[...roomHits,...mkHits].slice(0,7);
  if(!hits.length){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=hits.map(r=>`<div class="sri" onclick="pickR('${r.name}')">
    <span style="font-size:18px;">${r.block==='A'?'🟡':r.block==='V'?'🔴':r.block==='AZUL'?'🔵':r.block==='BE'?'🟤':r.block==='R'?'🏛️':r.block==='B'?'📚':'📍'}</span>
    <div><p class="sri-nm">${r.name}</p><p class="sri-sub">${r.bName}${r.floor?' · '+r.fLbl:''}</p></div>
    <span style="margin-left:auto;color:var(--up);font-size:12px;font-weight:800;">→</span>
  </div>`).join('');
}

function pickR(name){
  const b=document.getElementById('srBox'),s=document.getElementById('mSrch');
  if(b)b.style.display='none';if(s)s.value=name;
  routeTarget=name;go('map',{target:name});
}

function clSrch(){
  const s=document.getElementById('mSrch'),b=document.getElementById('srBox');
  if(s)s.value='';if(b)b.style.display='none';
  collapseSearch();
  clearRoute();
}

    <button class="btn-s" onclick="go('profile')">Cancelar</button>
  </div>`;
  scr.appendChild(pg);
  addNav('home');
}

function handlePhotoUpload(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{
    userInfo.avatarImg=ev.target.result;
    if(registeredUsers[userInfo.email])registeredUsers[userInfo.email].avatarImg=ev.target.result;
    const prev=document.getElementById('editAvatarPreview');
    if(prev)prev.innerHTML=`<img src="${ev.target.result}" style="width:90px;height:90px;object-fit:cover;border-radius:50%;">`;
  };r.readAsDataURL(f);
}

function saveProfile(){
  const nameEl=document.getElementById('editName');
  if(!nameEl)return;
  const name=nameEl.value.trim();
  if(!name){nameEl.classList.add('er');return;}
  const initials=name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'EU';
  userInfo.name=name;
  if(!userInfo.avatarImg)userInfo.avatar=initials;
  if(registeredUsers[userInfo.email]){
    registeredUsers[userInfo.email].name=name;
    if(!userInfo.avatarImg)registeredUsers[userInfo.email].avatar=initials;
  }
  showToast('Perfil atualizado com sucesso! ✅');
  go('profile');
}

function doLogout(){
  userInfo={name:'Visitante',email:'',avatar:'👤',isVisitor:true,avatarImg:null};
  go('login');
}

/* ══════ FAVORITES ══════ */
function rFavorites(){
  if(userInfo.isVisitor){showVisitorBlock();return;}
  scr.innerHTML='';
  const pg=document.createElement('div');pg.className='pg';
  pg.innerHTML=`
  <div class="hdr ${N?'nv':''}">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="back-b" onclick="go('profile')"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 16L7 10L13 4" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <span style="color:#fff;font-size:17px;font-weight:800;">⭐ Favoritos</span>
    </div>
  </div>
  ${favorites.length===0?`
  <div style="padding:40px 14px;text-align:center;">
    <div style="font-size:48px;margin-bottom:12px;">☆</div>
    <p style="font-size:16px;font-weight:800;color:${N?'var(--ng-txt)':'var(--txt)'};">Nenhum favorito ainda</p>
    <p style="font-size:13px;color:var(--txt3);margin:8px 0 16px;">Toque em ☆ ao traçar uma rota para salvar.</p>
    <button class="btn-p" onclick="go('map')">Explorar Mapa</button>
  </div>`:
  `<div class="card" style="margin-top:12px;margin-bottom:80px;">
    ${favorites.map(f=>`<div class="li" onclick="go('map',{target:'${f}'})">
      <div class="ib">⭐</div>
      <div style="flex:1;"><p class="t1">${f}</p><p class="t2">Rota salva</p></div>
      <button onclick="event.stopPropagation();removeFav2('${f}')" style="background:none;border:none;cursor:pointer;font-size:16px;color:#c0392b;margin-right:4px;">🗑</button>
      <span class="t3" style="font-size:12px;">Ir →</span>
    </div>`).join('')}
  </div>`}`;
  scr.appendChild(pg);
  addNav('home');
}
function removeFav2(name){favorites=favorites.filter(f=>f!==name);go('favorites');}

/* ══════ BOOT ══════ */
go('login');
</script>
